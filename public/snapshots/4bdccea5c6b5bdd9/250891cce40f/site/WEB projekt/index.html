<!DOCTYPE html>
<html lang="cs">

<head>
    <base href="./">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Shop Eshop – Nabídka hodinek</title>
    <meta name="description"
        content="Watch Shop Eshop – prémiové hodinky Oyster Diplomat 89. Nenabízíme jen přehled o čase.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header" id="header">
        <div class="header__inner">
            <a href="./index.html" class="header__logo" id="logo-link">
                <img src="./logo.png" alt="Watch Shop Eshop logo" class="header__logo-img">
            </a>
        </div>
    </header>

    <!-- HERO TAGLINE -->
    <section class="tagline" id="tagline-section">
        <p class="tagline__text">nenabízíme jen přehled o čase</p>
    </section>

    <!-- PRODUCT GRID -->
    <main class="products" id="products-section">
        <div class="products__grid">

            <a href="./detail.html" class="product-card" id="product-1">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Oyster Diplomat 89" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Oyster Diplomat 89</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-2">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Midnight Executive" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Midnight Executive</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-3">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Heritage Gold" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Heritage Gold</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-4">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Zenith Titanium" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Zenith Titanium</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-5">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Classic Chronograph" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Classic Chronograph</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-6">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Lunar Phase" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Lunar Phase</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-7">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Obsidian Sport" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Obsidian Sport</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-8">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Royal Diplomat" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Royal Diplomat</span>
            </a>

            <a href="./detail.html" class="product-card" id="product-9">
                <div class="product-card__img-wrap">
                    <img src="./hodinky_bez_textu.png" alt="Horizon Blue" class="product-card__img" loading="lazy">
                </div>
                <span class="product-card__name">Horizon Blue</span>
            </a>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer" id="footer">
        <div class="footer__inner">
            <div class="footer__social" id="footer-social">
                <a href="https://instagram.com" target="_blank" rel="noopener" class="footer__social-link"
                    id="social-instagram">
                    <svg class="footer__social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" />
                        <circle cx="12" cy="12" r="5" />
                        <circle cx="17.5" cy="6.5" r="1.5" />
                    </svg>
                    instagram
                </a>
                <a href="https://facebook.com" target="_blank" rel="noopener" class="footer__social-link"
                    id="social-facebook">
                    <svg class="footer__social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                    </svg>
                    facebook
                </a>
            </div>
            <div class="footer__nav">
                <a href="./pobocky.html" class="footer__btn">Naše pobočky</a>
            </div>
            <div class="footer__brand">
                <img src="./logo.png" alt="Watch Shop Eshop logo" class="footer__logo-img">
            </div>
        </div>
    </footer>

</body>

</html>
