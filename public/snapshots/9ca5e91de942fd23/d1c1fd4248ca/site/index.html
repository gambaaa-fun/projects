<!DOCTYPE html>
<html lang="cs">
<head>
    <base href="./">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline of Light and Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --gold: #c9a84c;
    --gold-bright: #f0cc70;
    --light: #e8d5a0;
    --dark-bg: #040810;
    --mid-bg: #070e1c;
    --card-bg: rgba(4, 10, 22, 0.72);
    --border-glow: rgba(201, 168, 76, 0.3);
    --text-muted: rgba(200, 185, 145, 0.55);
    --white: #f0ece0;
  }
 
  html { scroll-behavior: smooth; }
 
  body {
    background:
      linear-gradient(to bottom, rgba(2,6,18,0.55) 0%, rgba(2,6,18,0.75) 50%, rgba(2,6,18,0.92) 100%),
      url('./tl/traveler-bg.png') center top / cover scroll;
    background-color: var(--dark-bg);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 400;
    overflow-x: hidden;
    cursor: default;
  }
 
  /* HERO */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
 
  .hero-bg {
    position: absolute; inset: 0;
    background: transparent;
  }
 
  .stars-layer {
    display: none;
    position: absolute; inset: 0;
  }
 
  .traveler-sphere { display: none; }
  .traveler-beam { display: none; }
 
  .hero-content {
    position: relative;
    z-index: 2;
    margin-top: 80px;
    animation: fadeUp 1.2s ease forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
 
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
 
  /* DESTINY 2 GAME LOGO */
  .game-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 28px;
  }
 
  .game-logo-icon {
    width: 44px;
    height: 44px;
    filter: brightness(0) invert(1);
    flex-shrink: 0;
  }
 
  .game-logo-text {
    font-family: 'Exo 2', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #ffffff;
    line-height: 1;
  }
 
  .game-logo-divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
    margin-bottom: 28px;
  }
 
  .hero-subtitle {
    font-family: 'Exo 2', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }
 
  .hero-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(32px, 6vw, 72px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 2px;
    color: var(--white);
    text-shadow: 0 0 60px rgba(201,168,76,0.3);
  }
 
  .hero-title span.light { color: #A1B1D6; }
  .hero-title span.dark { color: #CF9B38; }
 
  .hero-desc {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 1px;
    max-width: 500px;
    line-height: 1.7;
  }
 
  .scroll-hint {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--text-muted);
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    animation: pulse 2s infinite;
  }
 
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
 
  .scroll-hint::after {
    content: '';
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
  }
 
  /* TIMELINE SECTION */
  .timeline-section {
    padding: 50px 0 120px;
    position: relative;
  }
 
  .section-header {
    text-align: center;
    margin-bottom: 70px;
    padding: 0 20px;
  }
 
  .section-label {
    font-family: 'Exo 2', sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }
 
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(22px, 4vw, 40px);
    font-weight: 600;
    color: var(--white);
  }
 
  .section-line {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto 0;
  }
 
  /* VERTICAL TIMELINE */
  .v-timeline {
    position: relative;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 40px 120px;
  }
 
  .v-line {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.5) 5%, rgba(201,168,76,0.5) 95%, transparent);
  }
 
  .v-node {
    display: grid;
    grid-template-columns: 1fr 130px 1fr;
    align-items: center;
    gap: 0;
    margin-bottom: 110px;
    position: relative;
  }
 
  .v-node:last-child { margin-bottom: 0; }
 
  .v-label-left {
    text-align: right;
    padding-right: 24px;
  }
 
  .v-label-right {
    text-align: left;
    padding-left: 24px;
  }
 
  .v-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 2;
  }
 
  .v-orb {
    width: 130px; height: 130px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    transition: transform 0.3s ease;
    cursor: default;
  }
 
  .v-orb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }
 
  .v-node-link {
    display: grid;
    grid-template-columns: 1fr 130px 1fr;
    align-items: center;
    gap: 0;
    margin-bottom: 110px;
    position: relative;
    text-decoration: none;
    color: inherit;
  }
 
  .v-node-link:last-child { margin-bottom: 0; }
 
  .v-node-link .v-orb {
    cursor: pointer;
  }
 
  .v-node-link:hover .v-orb {
    transform: scale(1.1);
  }
 
  .v-node-link:hover .v-name {
    color: var(--gold-bright);
    text-shadow: 0 0 12px rgba(240, 204, 112, 0.4);
  }
 
  .v-name {
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }
 
  .v-year {
    font-family: 'Exo 2', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--text-muted);
  }
 
  .v-name {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    line-height: 1.3;
  }
 
  .v-desc {
    font-size: 12px;
    font-weight: 300;
    color: rgba(200,185,145,0.65);
    line-height: 1.65;
    letter-spacing: 0.2px;
  }
 
  .v-tags {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-top: 8px;
  }
 
  .v-tag {
    font-family: 'Exo 2', sans-serif;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.07);
  }
 
  /* connector tick removed */
  .v-node::before {
    display: none;
  }

  /* FOOTER */
  footer {
    border-top: 1px solid rgba(201,168,76,0.1);
    padding: 40px;
    text-align: center;
    font-family: 'Exo 2', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
 
  /* ANIMATIONS */
  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
 
<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="stars-layer"></div>
  <div class="traveler-sphere"></div>
  <div class="traveler-beam"></div>
 
  <div class="hero-content">
 
    <!-- DESTINY 2 GAME LOGO -->
    <div class="game-logo">
      <img class="game-logo-icon" src="./tl/tricorn.png" alt="Destiny Tricorn">
      <span class="game-logo-text">DESTINY 2</span>
    </div>
 
    <div class="game-logo-divider"></div>
 
    <h1 class="hero-title">
      Timeline of<br>
      <span class="light">Light</span> and <span class="dark">Dark</span>
    </h1>
  </div>
</section>
 
<!-- VERTICAL TIMELINE -->
<section class="timeline-section">
  <div class="v-timeline">
    <div class="v-line"></div>
 
    <!-- Red War -->
    <a href="./nodes/rw.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"><div class="v-name">Red War</div></div>
      <div class="v-center"><div class="v-orb orb-rw"><img src="./tl/img_rw.png" alt="Red War"></div></div>
      <div class="v-label-right"></div>
    </a>
 
    <!-- Curse of Osiris -->
    <a href="./nodes/co.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"></div>
      <div class="v-center"><div class="v-orb orb-co"><img src="./tl/img_co.png" alt="Curse of Osiris"></div></div>
      <div class="v-label-right"><div class="v-name">Curse of Osiris</div></div>
    </a>
 
    <!-- Warmind -->
    <a href="./nodes/wm.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"><div class="v-name">Warmind</div></div>
      <div class="v-center"><div class="v-orb orb-wm"><img src="./tl/img_wm.png" alt="Warmind"></div></div>
      <div class="v-label-right"></div>
    </a>
 
    <!-- Forsaken -->
    <a href="./nodes/fs.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"></div>
      <div class="v-center"><div class="v-orb orb-fs"><img src="./tl/img_fs.png" alt="Forsaken"></div></div>
      <div class="v-label-right"><div class="v-name">Forsaken</div></div>
    </a>
 
    <!-- Shadowkeep -->
    <a href="./nodes/sk.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"><div class="v-name">Shadowkeep</div></div>
      <div class="v-center"><div class="v-orb orb-sk"><img src="./tl/img_sk.png" alt="Shadowkeep"></div></div>
      <div class="v-label-right"></div>
    </a>
 
    <!-- Beyond Light -->
    <a href="./nodes/bl.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"></div>
      <div class="v-center"><div class="v-orb orb-bl"><img src="./tl/img_bl.png" alt="Beyond Light"></div></div>
      <div class="v-label-right"><div class="v-name">Beyond Light</div></div>
    </a>
 
    <!-- Witch Queen -->
    <a href="./nodes/wq.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"><div class="v-name">Witch Queen</div></div>
      <div class="v-center"><div class="v-orb orb-wq"><img src="./tl/img_wq.png" alt="Witch Queen"></div></div>
      <div class="v-label-right"></div>
    </a>
 
    <!-- Lightfall -->
    <a href="./nodes/lf.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"></div>
      <div class="v-center"><div class="v-orb orb-lf"><img src="./tl/img_lf.png" alt="Lightfall"></div></div>
      <div class="v-label-right"><div class="v-name">Lightfall</div></div>
    </a>
 
    <!-- The Final Shape -->
    <a href="./nodes/tfs.html" class="v-node fade-in v-node-link">
      <div class="v-label-left"><div class="v-name">The Final Shape</div></div>
      <div class="v-center"><div class="v-orb orb-tfs"><img src="./tl/img_tfs.png" alt="The Final Shape"></div></div>
      <div class="v-label-right"></div>
    </a>
 
  </div>
</section>
 
<footer>
  &copy; Bungie — Destiny 2 — Timeline of Light and Dark
</footer>
 
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
 
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
</body>
</html>
