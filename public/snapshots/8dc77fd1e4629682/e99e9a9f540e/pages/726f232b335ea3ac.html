<!DOCTYPE html><html lang="cs"><head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Košík | Noodle Hub</title>
    <link rel="stylesheet" href="../assets/7b96214aa94d635e.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a class="brand" href="index.html">
                <i class="icon icon-bowl"></i> NOODLE HUB
            </a>
            <div class="nav-right">
                <input type="checkbox" id="menu-toggle" class="menu-toggle-checkbox" style="">
                <label for="menu-toggle" class="menu-toggle-btn">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </label>
                <div class="nav-links">
                    <a href="index.html">Domů</a>
                    <a href="products.html">Produkty</a>
                </div>
                <a href="cart.html" class="cart-link active">
                    <i class="icon icon-cart"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="container py-5">
        <h1 class="mb-5 fw-bold">Váš košík</h1>

        <div class="cart-layout" id="cart-container">
            <!-- Items -->
            <div class="cart-items" id="cart-items-list">
                <div class="empty-cart text-muted">
                    <i class="icon icon-cart" style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                    <h2 class="mb-3">Váš košík je prázdný</h2>
                    <p class="mb-4">Zatím jste si nevybrali žádné produkty.</p>
                    <a href="products.html" class="btn btn-primary">Přejít k produktům</a>
                </div>
            </div>

            <!-- Summary -->
            <div class="cart-summary" id="cart-summary-box" style="display: none;">
                <h3 class="mb-4">Shrnutí objednávky</h3>
                <div class="summary-row">
                    <span class="text-muted">Mezisoučet</span>
                    <span id="cart-subtotal">0 Kč</span>
                </div>
                <div class="summary-row">
                    <span class="text-muted">Doprava</span>
                    <span class="text-primary">Zdarma</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Celkem</span>
                    <span class="text-primary" id="cart-total">0 Kč</span>
                </div>
                <button class="btn btn-primary btn-block mt-4" id="checkout-btn">
                    POKRAČOVAT K POKLADNĚ
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="text-muted small">© 2026 Noodle Hub. Všechna práva vyhrazena.</p>
        </div>
    </footer>

    <script src="../assets/e0fcb46507e7a0b2.js"></script>
    <script src="../assets/e6fc4d0f1ba24b6a.js"></script>


</body></html>
