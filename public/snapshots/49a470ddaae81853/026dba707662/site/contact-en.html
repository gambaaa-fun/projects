<!DOCTYPE html>
<html lang="en">
<head>
    <base href="./">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jablotrade</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io%20(2)/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io%20(2)/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io%20(2)/favicon-16x16.png">
    <link rel="shortcut icon" href="favicon_io%20(2)/favicon.ico">
</head>
<body>
    <header>
        <h1><a href="./index-en.html">Jablotrade</a></h1>
        <div class="header-controls">
            <nav>
                <ul>
                    <li><a href="./index-en.html">Home</a></li>
                    <li><a href="./products-en.html">Products</a></li>
                    <li><a href="./contact-en.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <div class="lang-switch">
                <a href="./contact.html" class="lang-btn">CZ</a>
                <a href="./contact-en.html" class="lang-btn lang-btn-active">EN</a>
            </div>
        </div>
    </header>

    <main style="justify-content: center; align-items: center; display: flex; flex: 1;">
        <section class="fade-in" style="width: 100%;">
            <h2>Contact Us</h2>
            <p>Have a question or interested in a larger order? Write to us and we will get back to you as soon as possible.</p>

            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <div>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Smith" required>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>
                <div>
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" placeholder="Hello, I would be interested in..." required></textarea>
                </div>
                <button type="submit" style="width: 100%; margin-top: 1rem;">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jablotrade. All rights reserved.</p>
    </footer>
</body>
</html>
